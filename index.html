<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Roblox • Memória Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-container">
            <div class="titulo-area">
                <h1>Central Roblox</h1>
                <span id="status-memoria" class="subtitulo">● Carregando...</span>
            </div>

            <div class="acoes-topo">
                <button type="button" id="btn-ler-novamente" class="btn-secundario" title="Forçar nova leitura das Wikis">↻ Atualizar Wikis</button>
                <button type="button" id="btn-abrir-modal" class="btn-primario">+ Adicionar</button>
                <button type="button" id="btn-tema" class="btn-secundario" title="Alternar tema">Tema</button>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Filtro por Jogo -->
        <section class="filtros-jogos">
            <button type="button" class="jogo-pill ativo" data-jogo="todos">Todos os Jogos</button>
            <button type="button" class="jogo-pill" data-jogo="Jujutsu Shenanigans">Jujutsu Shenanigans</button>
            <button type="button" class="jogo-pill" data-jogo="Stand Out">Stand Out</button>
            <button type="button" class="jogo-pill" data-jogo="A Bizarre Run">A Bizarre Run</button>
            <button type="button" class="jogo-pill" data-jogo="Blox Fruits">Blox Fruits</button>
        </section>

        <!-- Barra de Controles e Abas -->
        <div class="barra-controles">
            <nav class="abas">
                <button type="button" class="aba-btn ativa" data-aba="secao-codigos">Códigos</button>
                <button type="button" class="aba-btn" data-aba="secao-updates">Atualizações</button>
                <button type="button" class="aba-btn" data-aba="secao-fontes">Wikis & Links</button>
            </nav>

            <input type="text" id="input-busca" placeholder="Buscar código ou novidade...">
        </div>

        <!-- ABA 1: COFRE DE CÓDIGOS -->
        <section id="secao-codigos" class="aba-conteudo ativa">
            <div class="cabecalho-secao">
                <h2 id="contador-codigos">Códigos na Memória</h2>
                <div class="filtro-status">
                    <button type="button" class="status-pill ativo" data-status="todos">Todos</button>
                    <button type="button" class="status-pill" data-status="ativo">Ativos</button>
                    <button type="button" class="status-pill" data-status="resgatado">Resgatados</button>
                </div>
            </div>

            <div id="grid-codigos" class="grid-cards"></div>
        </section>

        <!-- ABA 2: ATUALIZAÇÕES -->
        <section id="secao-updates" class="aba-conteudo">
            <div class="cabecalho-secao">
                <h2>Atualizações Salvas</h2>
            </div>

            <div id="lista-updates" class="lista-updates"></div>
        </section>

        <!-- ABA 3: LINKS DIRETOS -->
        <section id="secao-fontes" class="aba-conteudo">
            <div class="cabecalho-secao">
                <h2>Páginas Oficiais e Wikis</h2>
            </div>

            <div id="grid-fontes" class="grid-links"></div>
        </section>

    </main>

    <!-- Modal para Adicionar Código, Update ou Colar Lista -->
    <div id="modal-novo" class="modal-fundo" style="display: none;">
        <div class="modal-box">
            <div class="modal-topo">
                <h3>Salvar na Memória</h3>
                <button type="button" id="btn-fechar-modal" class="btn-fechar">✕</button>
            </div>

            <div class="tipo-registro">
                <button type="button" class="tipo-btn ativo" data-tipo="codigo">1 Código</button>
                <button type="button" class="tipo-btn" data-tipo="lote">Colar Lista</button>
                <button type="button" class="tipo-btn" data-tipo="update">Atualização</button>
            </div>

            <form id="form-adicionar">
                <div class="campo">
                    <label>Jogo</label>
                    <select id="select-jogo" required>
                        <option value="Jujutsu Shenanigans">Jujutsu Shenanigans</option>
                        <option value="Stand Out">Stand Out</option>
                        <option value="A Bizarre Run">A Bizarre Run</option>
                        <option value="Blox Fruits">Blox Fruits</option>
                    </select>
                </div>

                <!-- Opção 1: Código Único -->
                <div id="campos-codigo">
                    <div class="campo">
                        <label>Código</label>
                        <input type="text" id="input-codigo" placeholder="Ex: SUB2GAMERROBOT_EXP1">
                    </div>
                    <div class="campo">
                        <label>Recompensa</label>
                        <input type="text" id="input-recompensa" placeholder="Ex: 20 min de 2x EXP">
                    </div>
                </div>

                <!-- Opção 2: Colar Lista de qualquer site -->
                <div id="campos-lote" style="display: none;">
                    <div class="campo">
                        <label>Cole os códigos copiados de qualquer site (um por linha)</label>
                        <textarea id="input-lote" rows="5" placeholder="Exemplo:&#10;KITT_RESET - Reset de Status&#10;SUB2OFFICIALNOOBIE - 20 min 2x EXP"></textarea>
                    </div>
                </div>

                <!-- Opção 3: Atualização -->
                <div id="campos-update" style="display: none;">
                    <div class="campo">
                        <label>Título da Atualização</label>
                        <input type="text" id="input-titulo-update" placeholder="Ex: Update 24 • Novo Personagem">
                    </div>
                    <div class="campo">
                        <label>Resumo do que mudou</label>
                        <textarea id="input-desc-update" rows="3" placeholder="Anote os novos itens, nerfs ou eventos..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-primario btn-full">Guardar na Memória</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
