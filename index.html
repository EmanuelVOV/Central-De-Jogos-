<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Roblox • Wikis & Códigos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="topbar">
        <div class="topbar-container">
            <div class="titulo-area">
                <h1>Central Roblox</h1>
                <span id="status-sync" class="subtitulo">Pronto</span>
            </div>

            <div class="acoes-topo">
                <button type="button" id="btn-sincronizar" class="btn-primario">↻ Sincronizar Wikis</button>
                <button type="button" id="btn-abrir-modal" class="btn-secundario">+ Adicionar</button>
                <button type="button" id="btn-tema" class="btn-secundario" title="Alternar tema">Tema</button>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Filtro por Jogo -->
        <section class="filtros-jogos" id="filtros-jogos">
            <button type="button" class="jogo-pill ativo" data-jogo="todos">Todos os Jogos</button>
            <button type="button" class="jogo-pill" data-jogo="Jujutsu Shenanigans">Jujutsu Shenanigans</button>
            <button type="button" class="jogo-pill" data-jogo="Stand Out">Stand Out</button>
            <button type="button" class="jogo-pill" data-jogo="A Bizarre Run">A Bizarre Run</button>
            <button type="button" class="jogo-pill" data-jogo="Blox Fruits">Blox Fruits</button>
        </section>

        <!-- Barra de Controles e Abas -->
        <div class="barra-controles">
            <nav class="abas">
                <button type="button" class="aba-btn ativa" data-aba="secao-codigos">Códigos</button>
                <button type="button" class="aba-btn" data-aba="secao-updates">Atualizações</button>
                <button type="button" class="aba-btn" data-aba="secao-fontes">Wikis & Fontes</button>
            </nav>

            <input type="text" id="input-busca" placeholder="Filtrar código, item ou update...">
        </div>

        <!-- ABA 1: COFRE DE CÓDIGOS -->
        <section id="secao-codigos" class="aba-conteudo ativa">
            <div class="cabecalho-secao">
                <h2 id="contador-codigos">Códigos Disponíveis</h2>
                <div class="filtro-status">
                    <button type="button" class="status-pill ativo" data-status="todos">Todos</button>
                    <button type="button" class="status-pill" data-status="ativo">Não Resgatados</button>
                    <button type="button" class="status-pill" data-status="resgatado">Resgatados</button>
                </div>
            </div>

            <div id="grid-codigos" class="grid-cards"></div>
        </section>

        <!-- ABA 2: ATUALIZAÇÕES -->
        <section id="secao-updates" class="aba-conteudo">
            <div class="cabecalho-secao">
                <h2>Notas de Atualização (Wikis)</h2>
            </div>

            <div id="lista-updates" class="lista-updates"></div>
        </section>

        <!-- ABA 3: WIKIS E SITES DE CÓDIGOS -->
        <section id="secao-fontes" class="aba-conteudo">
            <div class="cabecalho-secao">
                <h2>Fontes Conectadas (Wikis & Sites de Códigos)</h2>
            </div>

            <div id="grid-fontes" class="grid-links"></div>
        </section>

    </main>

    <!-- Modal (inicia oculto via inline style para nunca bloquear cliques) -->
    <div id="modal-novo" class="modal-fundo" style="display: none;">
        <div class="modal-box">
            <div class="modal-topo">
                <h3>Adicionar ou Importar</h3>
                <button type="button" id="btn-fechar-modal" class="btn-fechar">✕</button>
            </div>

            <div class="tipo-registro">
                <button type="button" class="tipo-btn ativo" data-tipo="codigo">Código</button>
                <button type="button" class="tipo-btn" data-tipo="update">Atualização</button>
                <button type="button" class="tipo-btn" data-tipo="url">Importar Site</button>
            </div>

            <form id="form-adicionar">
                <div class="campo">
                    <label>Jogo</label>
                    <select id="select-jogo" required>
                        <option value="Jujutsu Shenanigans">Jujutsu Shenanigans</option>
                        <option value="Stand Out">Stand Out</option>
                        <option value="A Bizarre Run">A Bizarre Run</option>
                        <option value="Blox Fruits">Blox Fruits</option>
                    </select>
                </div>

                <!-- Campos de Código Manual -->
                <div id="campos-codigo">
                    <div class="campo">
                        <label>Código</label>
                        <input type="text" id="input-codigo" placeholder="Ex: SUB2GAMERROBOT_EXP1">
                    </div>
                    <div class="campo">
                        <label>Recompensa</label>
                        <input type="text" id="input-recompensa" placeholder="Ex: 20 min de 2x EXP">
                    </div>
                </div>

                <!-- Campos de Atualização Manual -->
                <div id="campos-update" style="display: none;">
                    <div class="campo">
                        <label>Título / Versão</label>
                        <input type="text" id="input-titulo-update" placeholder="Ex: Update 24 • Novo Mapa">
                    </div>
                    <div class="campo">
                        <label>Detalhes da Atualização</label>
                        <textarea id="input-desc-update" rows="3" placeholder="Descreva o que mudou..."></textarea>
                    </div>
                </div>

                <!-- Campos para Puxar de Site de Códigos / Wiki Externa -->
                <div id="campos-url" style="display: none;">
                    <div class="campo">
                        <label>Link da Página de Códigos (Pro Game Guides, Wiki, etc.)</label>
                        <input type="url" id="input-url-externa" placeholder="https://progameguides.com/roblox/...">
                    </div>
                    <p class="dica-modal">O sistema vai ler as tabelas e listas da página e importar os códigos novos automaticamente.</p>
                </div>

                <button type="submit" id="btn-salvar-modal" class="btn-primario btn-full">Salvar</button>
            </form>
        </div>
    </div>

    <!-- Notificação Flutuante -->
    <div id="toast" class="toast" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
